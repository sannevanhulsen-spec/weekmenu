name: prices
on:
  schedule:
    - cron: '0 5 * * *'   # 06:00 Amsterdam (winter), 07:00 (summer)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: npm ci
      - run: npx tsx fetcher/run.ts
      - name: Commit prices
        run: |
          git config user.name "weekmenu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices/latest.json
          if git diff --cached --quiet; then echo "geen wijzigingen"; exit 0; fi
          git commit -m "data: prijzen $(date -u +%F)"
          git push
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
